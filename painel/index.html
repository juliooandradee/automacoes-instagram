<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Automações do Instagram</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icone.svg" alt="" width="28" height="28">
      <span>Automações do Instagram</span>
    </div>
    <nav class="tabs" aria-label="Seções">
      <button type="button" class="tab" data-tab="automacoes" aria-current="page">Automações</button>
      <button type="button" class="tab" data-tab="conversas">Conversas</button>
      <button type="button" class="tab" data-tab="conexao">Conexão</button>
    </nav>
    <div class="who" id="who" aria-live="polite">Carregando…</div>
  </header>

  <main>
    <section id="tab-automacoes" class="panel" aria-label="Automações"></section>
    <section id="tab-conversas" class="panel" aria-label="Conversas" hidden></section>
    <section id="tab-conexao" class="panel" aria-label="Conexão" hidden></section>
  </main>

  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js" type="module"></script>
</body>
</html>
